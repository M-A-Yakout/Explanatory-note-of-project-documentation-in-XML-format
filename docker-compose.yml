services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: pz, POSTGRES_PASSWORD: pz, POSTGRES_DB: pz }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment: { DATABASE_URL: "postgresql+psycopg://pz:pz@db:5432/pz" }
    ports: ["8000:8000"]
    volumes: ["./backend:/srv"]
    depends_on: [db]
volumes: { pgdata: {} }
