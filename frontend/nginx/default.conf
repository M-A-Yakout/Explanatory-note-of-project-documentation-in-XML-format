server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # XML import travels as base64 (limit 20 MB in the app -> about 27 MB on the wire)
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: a client-supplied X-Forwarded-For must not become its "IP" (rate limiting, audit log)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # the API sets these three itself: hide its copies so each header is sent exactly once
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # content-hashed bundles: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # single-page app: any other path serves index.html (deep links, page reload); never cache it
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
