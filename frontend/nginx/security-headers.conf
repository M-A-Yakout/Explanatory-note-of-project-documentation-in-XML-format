# Included in every location: add_header in a location REPLACES the ones inherited from the server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style-src 'unsafe-inline': the UI library animates with inline style attributes. Scripts stay strictly 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Enable only when the site is served over HTTPS (terminate TLS in front of this container):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
